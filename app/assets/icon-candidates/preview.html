<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindMap Icon Candidates</title>
  <style>
    body {
      margin: 0;
      background: #f8fafc;
      color: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 1120px;
      margin: 36px auto;
      padding: 0 24px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 20px;
    }
    figure {
      margin: 0;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #ffffff;
      padding: 18px;
      box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
    }
    img {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 14px;
    }
    figcaption {
      text-align: center;
      font-weight: 750;
    }
    code {
      display: block;
      margin-top: 6px;
      color: #475569;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>MindMap Icon Candidates</h1>
    <div class="grid">
      <figure>
        <img src="./01-layered-flow.svg" alt="layered flow">
        <figcaption>01 Layered Flow<code>01-layered-flow.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./02-node-constellation.svg" alt="node constellation">
        <figcaption>02 Node Constellation<code>02-node-constellation.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./03-ribbon-map.svg" alt="ribbon map">
        <figcaption>03 Ribbon Map<code>03-ribbon-map.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./04-paper-routes.svg" alt="paper routes">
        <figcaption>04 Paper Routes<code>04-paper-routes.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./05-orbit-board.svg" alt="orbit board">
        <figcaption>05 Orbit Board<code>05-orbit-board.svg</code></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
