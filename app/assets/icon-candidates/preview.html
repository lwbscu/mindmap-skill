<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindMap Icon Candidates</title>
  <style>
    body {
      margin: 0;
      background: #08111f;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 36px auto;
      padding: 0 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }
    .note {
      margin: 0 0 26px;
      color: #9fb0c8;
      font-size: 14px;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 22px;
    }
    figure {
      margin: 0;
      border: 1px solid #273a58;
      border-radius: 15px;
      background: #0d1728;
      padding: 16px 16px 18px;
      box-shadow: 0 18px 44px rgb(0 0 0 / 28%);
    }
    img {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 14px;
    }
    .sizes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 14px;
      min-height: 42px;
    }
    .sizes img {
      margin: 0;
    }
    .sizes img:nth-child(1) {
      width: 64px;
      height: 64px;
    }
    .sizes img:nth-child(2) {
      width: 40px;
      height: 40px;
    }
    .sizes img:nth-child(3) {
      width: 28px;
      height: 28px;
    }
    figcaption {
      text-align: center;
      font-weight: 750;
      color: #f8fafc;
    }
    code {
      display: block;
      margin-top: 6px;
      color: #a7b7cf;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>MindMap Icon Candidates v2</h1>
    <p class="note">Dark launcher tile, white icon canvas, heavy ink outline, amber/orange accents, and small-size previews.</p>
    <div class="grid">
      <figure>
        <img src="./01-layered-flow.svg" alt="layered flow">
        <div class="sizes">
          <img src="./01-layered-flow.svg" alt="">
          <img src="./01-layered-flow.svg" alt="">
          <img src="./01-layered-flow.svg" alt="">
        </div>
        <figcaption>01 Command Tower<code>01-layered-flow.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./02-node-constellation.svg" alt="node constellation">
        <div class="sizes">
          <img src="./02-node-constellation.svg" alt="">
          <img src="./02-node-constellation.svg" alt="">
          <img src="./02-node-constellation.svg" alt="">
        </div>
        <figcaption>02 Crimson Route<code>02-node-constellation.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./03-ribbon-map.svg" alt="ribbon map">
        <div class="sizes">
          <img src="./03-ribbon-map.svg" alt="">
          <img src="./03-ribbon-map.svg" alt="">
          <img src="./03-ribbon-map.svg" alt="">
        </div>
        <figcaption>03 Node Badge<code>03-ribbon-map.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./04-paper-routes.svg" alt="paper routes">
        <div class="sizes">
          <img src="./04-paper-routes.svg" alt="">
          <img src="./04-paper-routes.svg" alt="">
          <img src="./04-paper-routes.svg" alt="">
        </div>
        <figcaption>04 Blueprint Core<code>04-paper-routes.svg</code></figcaption>
      </figure>
      <figure>
        <img src="./05-orbit-board.svg" alt="orbit board">
        <div class="sizes">
          <img src="./05-orbit-board.svg" alt="">
          <img src="./05-orbit-board.svg" alt="">
          <img src="./05-orbit-board.svg" alt="">
        </div>
        <figcaption>05 Route Console<code>05-orbit-board.svg</code></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
